name: Release

# Obsidian installs a plugin from a release whose tag is the bare version —
# 1.2.3, not v1.2.3 — holding main.js, manifest.json and styles.css as assets.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write
  # Both are for the build provenance below: `id-token` to get the OIDC token
  # that proves which workflow ran, `attestations` to record the result.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tag must match manifest.json
        run: node .github/scripts/check-manifest.mjs "${GITHUB_REF_NAME}"

      - name: Full check
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test

      - name: Bundle
        run: node esbuild.config.mjs production

      - name: Bundle loads the way Obsidian loads it
        run: node .github/scripts/smoke-bundle.mjs

      # Signs a statement that these exact bytes came out of this workflow, from
      # this commit. `gh attestation verify main.js --repo …` checks it, which is
      # what turns "the source is on GitHub" into something a reader can confirm
      # about the file they actually downloaded.
      - name: Attest the release assets
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      # Release prose comes from the curated changelog rather than generated PR
      # titles. A version missing from it fails instead of publishing an empty body.
      - name: Release notes, from the changelog
        run: node .github/scripts/release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            main.js manifest.json styles.css

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: format · lint · types · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Invisible bytes
        run: node .github/scripts/check-source-bytes.mjs

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Tests
        run: npm run test:coverage

      - name: Version metadata
        run: node .github/scripts/check-manifest.mjs

      - name: Bundle
        run: node esbuild.config.mjs production

      - name: Bundle loads the way Obsidian loads it
        run: node .github/scripts/smoke-bundle.mjs

      # What a reviewer would otherwise have to build themselves to try a PR.
      - uses: actions/upload-artifact@v7
        with:
          name: advanced-maps-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error

name: Feature request
description: Something the plugin should do and does not
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, not the solution — it often has a shorter route.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I have checked this is not already done by the built-in Maps view.
